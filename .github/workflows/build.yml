name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build EventBlitz.slnx -c Release
      - run: dotnet test tests/EventBlitz.Core.Tests/EventBlitz.Core.Tests.csproj -c Release --no-build

  # Every push to master refreshes the "nightly" pre-release (zip + update.json for the in-app updater).
  nightly:
    if: github.event_name == 'push'
    uses: TomasBouda/TomLabs.AutoUpdate/.github/workflows/publish-app.yml@master
    with:
      project: src/EventBlitz.App/EventBlitz.App.csproj
      app-name: EventBlitz
      channel: nightly
      dotnet-version: '10.0.x'
    secrets:
      signing-key: ${{ secrets.UPDATE_SIGNING_KEY }}
